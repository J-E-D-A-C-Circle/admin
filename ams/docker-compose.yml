services:
  ams-db:
    image: mysql:8.0
    container_name: dams-db
    restart: always 
    environment:
      MYSQL_ROOT_PASSWORD: dams_root_password
      MYSQL_DATABASE: dams_db
      MYSQL_USER: dams_user
      MYSQL_PASSWORD: dams_password
    ports:
      - '3308:3306'
    volumes:
      - dams_db_data:/var/lib/mysql
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - dams-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ams-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dams-phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      - PMA_HOST=ams-db
      - PMA_USER=dams_user
      - PMA_PASSWORD=dams_password
    depends_on:
      ams-db:
        condition: service_healthy
    networks:
      - dams-network

  ams-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dams-web
    restart: always
    ports:
      - '3001:3001'
    environment:
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=mysql://dams_user:dams_password@ams-db:3306/dams_db
      - JWT_SECRET=${JWT_SECRET:-super-secure-dvla-dams-jwt-secret-key-2026}
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - dams_uploads:/app/public/uploads
    depends_on:
      ams-db:
        condition: service_healthy
    networks:
      - dams-network
      - dvla-admin-net

volumes:
  dams_db_data:
  dams_uploads:

networks:
  dams-network:
    driver: bridge
  dvla-admin-net:
    name: dvla-admin-net
    driver: bridge
